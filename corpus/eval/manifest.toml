# The accuracy eval corpus.
#
# One entry per recorded clip. This file is the **script** — read `say` aloud to
# record `<id>.wav` — and it is also the reference the result is scored against.
#
# ## Two fields, because there are two questions
#
# `say`    what you read aloud. Also the reference for the **raw** recogniser
#          output, since it is literally what was spoken.
# `expect` what should end up in the document after correction and the personal
#          dictionary. Defaults to `say`, and is only written out where the two
#          genuinely differ.
#
# They differ exactly where govox is meant to be doing work. You say "rentals
# dot ca" and the document should read "rentals.ca"; you say "comma" and a comma
# should appear. Scoring both against one string would either mark correct
# behaviour as an error or hide the dictionary doing its job — and the gap
# between the two scores is precisely what the dictionary is worth.
#
# ## Why these clips
#
# Nothing here is invented. Every `term` is a word that has actually been
# mis-recognised on this machine — each has a matching `replace` rule in the
# personal dictionary, which is a logbook of real failures:
#
#   twilling gate / twiddling gate -> Twillingate
#   bona vista                     -> Bonavista
#   glover town                    -> Glovertown
#   lewis port                     -> Lewisporte
#   rent sync                      -> Rentsync
#   jurl                           -> Jira
#   rentals dot ca / dot c a       -> rentals.ca
#
# `terms` are what the clip must get right, scored separately from word error
# rate and mattering more: WER over a six-word sentence moves in 16% steps,
# whereas "did Twillingate survive" is a fact. They are checked against the
# corrected text, so a term rescued by a dictionary rule counts as a hit — that
# is the rule earning its place.
#
# The audio is **not** in git (see .gitignore). This file and the scores are, so
# the numbers stay reviewable without publishing the recordings.
#
# ## Recording
#
#   tools/record-eval.sh                     # every clip with no audio yet
#   tools/record-eval.sh twillingate-drive   # re-record just one
#
# Read at a normal dictation pace. Do not over-enunciate: the corpus is only
# useful if it sounds like ordinary use.

# --- Newfoundland place names ------------------------------------------------
# The largest cluster of known failures, and what the bias list was written for.

[[clip]]
id = "twillingate-drive"
say = "We drove out to Twillingate on Saturday afternoon."
terms = ["Twillingate"]

[[clip]]
id = "twillingate-bonavista"
say = "Twillingate and Bonavista are both worth the trip."
terms = ["Twillingate", "Bonavista"]

[[clip]]
id = "glovertown-appleton"
say = "The road to Glovertown runs past Appleton."
terms = ["Glovertown", "Appleton"]

[[clip]]
id = "lewisporte-ferry"
say = "The ferry leaves from Lewisporte in the morning."
terms = ["Lewisporte"]

[[clip]]
id = "gander-gambo"
say = "It is about half an hour from Gander to Gambo."
terms = ["Gander", "Gambo"]

[[clip]]
id = "notre-dame-bay"
say = "There was ice in Notre Dame Bay well into June."
terms = ["Notre Dame Bay"]

[[clip]]
id = "newfoundland-labrador"
say = "Newfoundland and Labrador is the full name of the province."
terms = ["Newfoundland", "Labrador"]

[[clip]]
id = "avalon-drive"
say = "We are driving down to the Avalon next weekend."
terms = ["Avalon"]

