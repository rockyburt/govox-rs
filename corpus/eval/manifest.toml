# --- Programming vocabulary --------------------------------------------------
# This section is different in kind from every one above it, and the difference
# matters when reading the scores.
#
# Everything above is a **logbook**: each term is a word that actually failed on
# this machine, and each has a matching `replace` rule in the personal
# dictionary. These clips are a **hypothesis** instead. Nothing here has been
# observed failing, because nothing here has ever been measured — the corpus had
# no programming vocabulary at all, so "does Whisper handle Rust and JavaScript"
# was a question the eval could not answer either way. There are no dictionary
# rules for these terms yet. That is deliberate: the first run measures the
# recogniser unaided, which is the number worth having before deciding what to
# add.
#
# Expect a worse score here than elsewhere on the first pass, and expect that to
# be informative rather than alarming. A term that survives needs no rule; a
# term that does not is a candidate for the dictionary or for spelling mode.
#
# ## One clip asserts behaviour govox does not have yet
#
# All three spoken-symbol clips came out wrong when this section was written.
# Two are now fixed: `capitalize_after_terminators` no longer treats the full
# stop from a spoken "dot" as a sentence boundary, so "main dot rs" gives
# `main.rs` and "JSON dot parse" gives `JSON.parse`.
#
# `flag-double-hyphen` still fails, and the reason is not the one first recorded
# here. The punctuation stage renders both marks perfectly; what collapses is the
# repeated *word*, because `collapse_repeated_words` runs first and turns
# "hyphen hyphen" into "hyphen". With `collapse_repeats = false` the pipeline
# produces `--all-targets` correctly.
#
#   "hyphen hyphen all hyphen targets" -> "-all-targets"  wanted "--all-targets"
#
# `expect` records what *should* land, not what does, so this clip stays red
# until that is fixed. That is the corpus working as a reference rather than as
# a snapshot of the bug.

[[clip]]
id = "rust-crates"
say = "We use serde and tokio in this crate."
terms = ["serde", "tokio"]

[[clip]]
id = "rust-impl-mut"
say = "Open the impl block and mark the variable as mut."
terms = ["impl", "mut"]

[[clip]]
id = "rust-unwrap-result"
say = "It returns a Result and you have to unwrap it."
