# --- Spoken punctuation ------------------------------------------------------
# The correction pipeline's own work. `say` is the spoken form, `expect` is what
# should land, and the distance between the raw and corrected scores here is
# entirely `apply_spoken_punctuation` doing its job.

[[clip]]
id = "spoken-punctuation-comma"
say = "First we test comma then we ship period"
expect = "First we test, then we ship."
terms = []

[[clip]]
