# --- The complaint that changed the model ------------------------------------
# "ultra filtered milk" arriving as "ultra-fiddle" is why the configured model
# moved from small to large-v3-turbo on 2026-08-14. It has no dictionary rule,
# so it scores the recogniser directly with nothing to rescue it.

[[clip]]
id = "ultra-filtered-milk"
say = "Pick up a carton of ultra filtered milk."
terms = ["ultra filtered milk"]

[[clip]]
id = "ultra-filtered-milk-long"
say = "The ultra filtered milk lasts a lot longer in the fridge."
terms = ["ultra filtered milk"]

# --- Ordinary prose ----------------------------------------------------------
# Without these the corpus is all hard words, and a model that got worse at
# plain English would still score well. These carry no `terms`: their whole job
# is word error rate on sentences with nothing unusual in them.

[[clip]]
id = "prose-meeting"
say = "Let us push the meeting back to the middle of next week."
terms = []

[[clip]]
