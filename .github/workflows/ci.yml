name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every cargo invocation in this file must see an identical environment.
# RUSTFLAGS, the feature set and the profile are all part of a crate's
# fingerprint, so a single difference between two steps silently compiles the
# whole workspace a second time — and the cache then stores both.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
  # Incremental compilation pays off across repeated edits on one machine. A
  # runner is fresh every time, so here it is pure overhead that also bloats
  # what the cache has to carry.
  CARGO_INCREMENTAL: 0
  # Full debuginfo dominates link time and cache size. Line tables are enough to
  # read a panic location, which is all CI ever needs from a backtrace.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Format, lint and test are one job on purpose. Split across three, each would
  # restore its own cache and rebuild the workspace — including whisper.cpp,
  # which is C++ compiled from source and dominates the run. One job, one
  # target/, one build.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cpal binds ALSA, and whisper.cpp is compiled from source with the Vulkan
      # backend that `govox-asr` ships as its default feature — which needs the
      # Vulkan headers and `glslc` for its shaders. libssl-dev arrives via
      # hf-hub -> reqwest -> native-tls, and libclang-dev is what bindgen loads.
      # mold is the linker; see RUSTFLAGS above.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libvulkan-dev glslc libssl-dev libclang-dev mold

      # No toolchain named here on purpose: a bare install reads
      # rust-toolchain.toml, so the version and its components live in exactly
      # one place and CI cannot drift from a developer's machine.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      # Keys on the toolchain and the lockfile, and prunes target/ before
      # saving. Hand-rolling this with actions/cache reliably ends up slower,
      # because an unpruned target/ grows without bound until restoring it costs
      # more than the rebuild it was meant to avoid.
      - uses: Swatinem/rust-cache@v2

      # A prebuilt binary in seconds rather than several minutes of
      # `cargo install` compiling it from source on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo nextest run --workspace

      # Hardware- and desktop-dependent tests are #[ignore]d, mirroring
      # govox-py's `@pytest.mark.integration`. They are listed but not run, so a
      # test that silently stops existing is still visible in CI.
      - name: List ignored tests
        run: cargo nextest list --workspace --run-ignored ignored-only

  reference-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # REFERENCE names the single govox-py commit this port targets. It must
      # stay a full 40-character SHA: a branch name or short SHA would let the
      # parity corpus re-baseline itself against upstream work in progress,
      # which turns a real divergence into a passing test.
      - name: REFERENCE names a full commit SHA
        run: ./tools/parity-gen/check-pin.sh

      # A generator that reaches for the live checkout instead of the extracted
      # pinned source silently defeats the pin.
      - name: No generator reads the live govox-py checkout
        run: |
          set -euo pipefail
          if grep -rn 'govox-py/src' tools/ 2>/dev/null; then
            echo "::error::a tool references govox-py/src directly; use .parity-src via pinned-source.sh"
            exit 1
          fi
          echo "no direct references to the live checkout"

  # Deliberately has no cache: `cargo tree` reads the lockfile and compiles
  # nothing, so restoring and re-saving a build cache here would cost time and
  # buy nothing.
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install

      # govox-core is the parity heart and must stay testable on any machine
      # with no hardware and no desktop session. If it ever gains a dependency
      # on tokio, a sibling crate or an OS binding, the differential harness
      # stops being cheap to run and this check fails.
      - name: govox-core has no in-workspace or async dependencies
        run: |
          set -euo pipefail
          deps=$(cargo tree -p govox-core --edges normal --prefix none \
                 | awk '{print $1}' | sort -u)
          for forbidden in tokio govox-audio govox-vad govox-asr \
                           govox-input govox-ime govox-a11y govox-ui govox-daemon; do
            if grep -qx "$forbidden" <<<"$deps"; then
              echo "::error::govox-core must not depend on $forbidden"
              exit 1
            fi
          done
          echo "govox-core layering OK"
